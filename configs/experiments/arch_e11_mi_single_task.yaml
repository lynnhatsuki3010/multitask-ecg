# ARCH-E11: MI-only single-task model (decoupled subset-lead head)
#
# Trains only 4 MI labels with 100% capacity dedicated to MI detection.
# Use with E08 checkpoint via scripts/04_ensemble_eval.py for full 13-label inference.
#
# Train:
#   python scripts/02_train.py --config configs/experiments/arch_e11_mi_single_task.yaml
# Calibrate:
#   python scripts/03_calibrate.py --dir checkpoints/run_YYYYMMDD_HHMMSS_mi_only-tf-aug

paths:
  raw_data: "data/raw/PTB-XL"
  processed: "data/processed_dir4"
  splits: "data/splits_dir4"
  checkpoints: "checkpoints"

dataset:
  sampling_rate: 500
  signal_length: 5000
  num_leads: 12
  label_threshold: 50
  label_threshold_overrides:
    IMI: 80
  normal_label: NORM
  normal_mode: exclusive
  split_method: strat_fold
  test_fold: 10
  val_fold: 9
  split_seed: 42
  split_group_key: patient_id
  split_train_ratio: 0.70
  split_val_ratio: 0.15
  split_test_ratio: 0.15
  split_num_folds: 10
  split_test_fold_index: 0
  split_val_fold_index: null
  split_stratify_label: null

labels:
  - name: IMI
    task: mi
    index: 5
  - name: ASMI
    task: mi
    index: 6
  - name: ILMI
    task: mi
    index: 7
  - name: AMI
    task: mi
    index: 8

label_groups:
  mi: [5, 6, 7, 8]

hrv:
  enabled: false

preprocessing:
  bandpass_low: 0.5
  bandpass_high: 40.0
  notch_freq: 50.0
  normalize: robust

model:
  architecture: mi_only
  mi_branch_dim: 128
  dropout: 0.15

augmentation:
  aug_lead_dropout: true
  aug_random_crop: false
  aug_baseline_wander: false
  aug_time_warp: false
  aug_mixup: false
  mixup_alpha: 0.2

training:
  batch_size: 96
  epochs: 15
  freeze_backbone_at_epoch: -1
  lr: 1.0e-4
  weight_decay: 1.0e-3
  scheduler: cosine
  warmup_epochs: 2
  loss_weights:
    arrhythmia: 0.0
    mi: 1.0
    conduction: 0.0
    imi: 1.0
    asmi: 1.0
    ilmi: 1.0
    ami: 1.0
    hrv: 0.0
  label_smoothing: 0.0
  use_pos_weight: false
  use_focal: false
  weighted_sampler: false
  seed: 42
  num_workers: 0
  pin_memory: true
  save_every: 5
  early_stopping_patience: 15
  monitor_metric: imi_auprc

eval:
  metrics: [auroc, auprc, f1, accuracy]
  threshold: 0.5
  val_tune_thresholds_every: 0
  threshold_search:
    min_threshold: 0.15
    min_pos_count: 20
    max_rare_threshold: 0.4
    class_beta:
      IMI: 1.5
      ASMI: 1.2
      ILMI: 1.5
      AMI: 1.5
