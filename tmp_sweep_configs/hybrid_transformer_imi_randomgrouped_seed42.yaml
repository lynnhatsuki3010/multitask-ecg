augmentation:
  aug_baseline_wander: false
  aug_lead_dropout: false
  aug_mixup: false
  aug_random_crop: false
  aug_time_warp: false
  mixup_alpha: 0.2
dataset:
  label_threshold: 50
  label_threshold_overrides:
    IMI: 80
  normal_label: NORM
  normal_mode: exclusive
  num_leads: 12
  sampling_rate: 500
  signal_length: 5000
  split_group_key: patient_id
  split_method: random_grouped
  split_seed: 42
  split_test_ratio: 0.15
  split_train_ratio: 0.7
  split_val_ratio: 0.15
eval:
  metrics:
  - auroc
  - auprc
  - f1
  - accuracy
  threshold: 0.5
  threshold_search:
    arrhythmia_max_threshold:
      AFIB: 0.75
      AFLT: 0.4
      STACH: 0.8
    arrhythmia_min_precision:
      AFIB: 0.2
      NORM: 0.7
      PVC: 0.2
      STACH: 0.2
    arrhythmia_min_threshold:
      AFIB: 0.2
      AFLT: 0.1
      NORM: 0.3
      PVC: 0.2
      STACH: 0.2
    class_beta:
      AFLT: 2.0
      ASMI: 1.2
      IMI: 1.5
      PVC: 1.0
    max_rare_threshold: 0.4
    mi_max_threshold:
      ASMI: 0.7
      IMI: 0.6
    mi_min_precision:
      ASMI: 0.3
      IMI: 0.3
    mi_min_threshold:
      ASMI: 0.2
      IMI: 0.2
    min_pos_count: 20
    min_threshold: 0.15
hrv:
  enabled: true
  features:
  - rmssd
  - sdnn
  - mean_hr
label_groups:
  arrhythmia:
  - 0
  - 1
  - 2
  - 3
  - 4
  mi:
  - 5
  - 6
labels:
- index: 0
  name: NORM
  task: normal
- index: 1
  name: AFIB
  task: arrhythmia
- index: 2
  name: STACH
  task: arrhythmia
- index: 3
  name: PVC
  task: arrhythmia
- index: 4
  name: AFLT
  task: arrhythmia
- index: 5
  name: IMI
  task: mi
- index: 6
  name: ASMI
  task: mi
model:
  architecture: hybrid_transformer
  cnn_stage_dims:
  - 128
  - 192
  - 256
  d_model: 256
  dim_feedforward: 512
  downsample_factor: 20
  dropout: 0.15
  head_hidden_dim: 128
  hrv_detach: true
  mi_branch_dim: 128
  nhead: 8
  num_encoder_layers: 4
  stem_dim: 96
paths:
  checkpoints: checkpoints
  processed: data/processed_imi80_randomgrouped
  raw_data: data/raw/PTB-XL
  splits: data/splits_imi80_randomgrouped
preprocessing:
  bandpass_high: 40.0
  bandpass_low: 0.5
  normalize: zscore
  notch_freq: 50.0
training:
  batch_size: 96
  cosine_T0: 15
  early_stopping_patience: 8
  epochs: 30
  focal_alpha: 0.25
  focal_gamma: 2.0
  hrv_loss: smooth_l1
  label_smoothing: 0.02
  loss_weights:
    arrhythmia: 1.0
    asmi: 0.75
    hrv: 0.02
    imi: 1.25
    mi: 1.8
  lr: 0.0001
  max_pos_weight: 30.0
  monitor_metric: imi_auprc
  num_workers: 0
  one_cycle_pct_start: 0.2
  pin_memory: true
  pos_weight_power: 0.75
  save_every: 5
  scheduler: one_cycle
  seed: 42
  use_focal: false
  use_pos_weight: true
  warmup_epochs: 5
  weight_decay: 0.001
  weighted_sampler: false
