# ============================================================
# BASELINE CONFIG — All techniques disabled ("Ground Zero")
# Used as the starting point for all ablation stages.
#
# DO NOT MODIFY THIS FILE for experiments.
# Copy to configs/experiments/<stage>_<exp>.yaml and change ONE thing.
# ============================================================

paths:
  raw_data: "data/raw/PTB-XL"
  processed: "data/processed_baseline"   # each experiment gets its own folder
  splits: "data/splits_baseline"
  checkpoints: "checkpoints"

dataset:
  sampling_rate: 500
  signal_length: 5000
  num_leads: 12
  label_threshold: 50
  label_threshold_overrides:
    IMI: 80
  normal_label: NORM
  normal_mode: exclusive

  # ── Split: PTB-XL native strat_fold (baseline) ──────────────────
  split_method: strat_fold
  test_fold: 10         # PTB-XL standard test fold
  val_fold: 9           # PTB-XL standard val fold

  # unused for strat_fold, kept for reference:
  split_seed: 42
  split_group_key: patient_id
  split_train_ratio: 0.70
  split_val_ratio: 0.15
  split_test_ratio: 0.15
  split_num_folds: 10
  split_test_fold_index: 0
  split_val_fold_index: null
  split_stratify_label: null

labels:
  - name: NORM
    task: normal
    index: 0
  - name: AFIB
    task: arrhythmia
    index: 1
  - name: STACH
    task: arrhythmia
    index: 2
  - name: PVC
    task: arrhythmia
    index: 3
  - name: AFLT
    task: arrhythmia
    index: 4
  - name: IMI
    task: mi
    index: 5
  - name: ASMI
    task: mi
    index: 6

label_groups:
  arrhythmia: [0, 1, 2, 3, 4]
  mi: [5, 6]

hrv:
  enabled: false          # HRV disabled across all ablation stages

preprocessing:
  bandpass_low: 0.5
  bandpass_high: 40.0
  notch_freq: 50.0
  normalize: zscore       # Stage 2 will test alternatives

model:
  architecture: hybrid_transformer
  d_model: 256
  stem_dim: 96
  downsample_factor: 20
  nhead: 8
  num_encoder_layers: 4
  dim_feedforward: 512
  cnn_stage_dims: [128, 192, 256]
  head_hidden_dim: 128
  mi_branch_dim: 128
  dropout: 0.15
  mi_gradient_scale: 1.0   # DISABLED — Stage 6 will test this
  hrv_detach: false

augmentation:
  aug_lead_dropout: false   # DISABLED — Stage 4 will test
  aug_random_crop: false
  aug_baseline_wander: false
  aug_time_warp: false
  aug_mixup: false
  mixup_alpha: 0.2

training:
  batch_size: 96
  epochs: 15                     # short runs for ablation
  freeze_backbone_at_epoch: -1   # DISABLED — Phase 2 strategy off
  lr: 1.0e-4
  weight_decay: 1.0e-3
  mi_lr_multiplier: 1.0          # DISABLED — Stage 6 will test
  scheduler: cosine
  warmup_epochs: 2
  loss_weights:
    arrhythmia: 1.0
    mi: 1.0                      # equal weights — Stage 3 will test
    imi: 1.0
    asmi: 1.0
    hrv: 0.0
  label_smoothing: 0.0           # DISABLED — Stage 3 will test
  hrv_loss: smooth_l1
  use_pos_weight: false           # DISABLED — Stage 3 will test
  use_focal: false                # DISABLED — Stage 3 will test
  focal_gamma: 2.0
  focal_alpha: 0.25
  max_pos_weight: 30.0
  pos_weight_power: 0.75
  weighted_sampler: false         # DISABLED — Stage 5 will test
  seed: 42
  num_workers: 0
  pin_memory: true
  save_every: 5
  early_stopping_patience: 15    # no early stop during ablation
  monitor_metric: imi_auprc

eval:
  metrics: [auroc, auprc, f1, accuracy]
  threshold: 0.5
  val_tune_thresholds_every: 0
  threshold_search:
    min_threshold: 0.15
    min_pos_count: 20
    max_rare_threshold: 0.4
    class_beta:
      PVC: 1.0
      AFLT: 2.0
      IMI: 1.5
      ASMI: 1.2
