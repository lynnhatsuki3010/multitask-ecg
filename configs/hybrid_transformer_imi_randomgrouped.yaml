paths:
  raw_data: "data/raw/PTB-XL"
  processed: "data/processed_imi80_randomgrouped"
  splits: "data/splits_imi80_randomgrouped"
  checkpoints: "checkpoints"

dataset:
  sampling_rate: 500
  signal_length: 5000
  num_leads: 12
  label_threshold: 50
  label_threshold_overrides:
    IMI: 80
  normal_label: NORM
  normal_mode: exclusive
  split_method: random_grouped
  split_group_key: patient_id
  split_seed: 123
  split_train_ratio: 0.70
  split_val_ratio: 0.15
  split_test_ratio: 0.15

labels:
  - name: NORM
    task: normal
    index: 0
  - name: AFIB
    task: arrhythmia
    index: 1
  - name: STACH
    task: arrhythmia
    index: 2
  - name: PVC
    task: arrhythmia
    index: 3
  - name: AFLT
    task: arrhythmia
    index: 4
  - name: IMI
    task: mi
    index: 5
  - name: ASMI
    task: mi
    index: 6

label_groups:
  arrhythmia: [0, 1, 2, 3, 4]
  mi: [5, 6]

hrv:
  enabled: true
  features: [rmssd, sdnn, mean_hr]

preprocessing:
  bandpass_low: 0.5
  bandpass_high: 40.0
  notch_freq: 50.0
  normalize: zscore

model:
  architecture: hybrid_transformer
  d_model: 256
  stem_dim: 96
  downsample_factor: 20
  nhead: 8
  num_encoder_layers: 4
  dim_feedforward: 512
  cnn_stage_dims: [128, 192, 256]
  head_hidden_dim: 128
  mi_branch_dim: 128
  dropout: 0.15
  mi_gradient_scale: 0.3
  hrv_detach: true

augmentation:
  aug_lead_dropout: false
  aug_random_crop: false
  aug_baseline_wander: false
  aug_time_warp: false
  aug_mixup: false
  mixup_alpha: 0.2

training:
  batch_size: 96
  epochs: 50
  lr: 1.0e-4
  weight_decay: 1.0e-3
  mi_lr_multiplier: 3.0
  scheduler: cosine_restart
  cosine_T0: 10
  warmup_epochs: 5
  loss_weights:
    arrhythmia: 1.0
    mi: 1.8
    imi: 1.25
    asmi: 0.75
    hrv: 0.02
  label_smoothing: 0.02
  hrv_loss: smooth_l1
  use_pos_weight: false
  max_pos_weight: 30.0
  pos_weight_power: 0.75
  use_focal: true
  weighted_sampler: false
  focal_gamma: 2.0
  focal_alpha: 0.25
  seed: 42
  num_workers: 0
  pin_memory: true
  save_every: 5
  early_stopping_patience: 12
  monitor_metric: imi_auprc

eval:
  metrics: [auroc, auprc, f1, accuracy]
  threshold: 0.5
  # See configs/config.yaml — set to 1 and monitor_metric to imi_f1_tuned for early-stop on tuned F1
  val_tune_thresholds_every: 0
  threshold_search:
    min_threshold: 0.15
    min_pos_count: 20
    max_rare_threshold: 0.4
    class_beta:
      PVC: 1.0
      AFLT: 2.0
      IMI: 1.5
      ASMI: 1.2
    arrhythmia_max_threshold:
      AFLT: 0.40
      AFIB: 0.75
      STACH: 0.80
    mi_max_threshold:
      IMI: 0.60
      ASMI: 0.70
    arrhythmia_min_threshold:
      NORM: 0.30
      AFIB: 0.20
      STACH: 0.20
      PVC: 0.20
      AFLT: 0.10
    arrhythmia_min_precision:
      NORM: 0.70
      AFIB: 0.20
      STACH: 0.20
      PVC: 0.20
    mi_min_threshold:
      IMI: 0.20
      ASMI: 0.20
    mi_min_precision:
      IMI: 0.30
      ASMI: 0.30
